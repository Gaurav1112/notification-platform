# =============================================================================
# The `test` profile: enough infrastructure for a context to load, and no more.
#
# This exists so ApplicationContextSmokeTest can answer one question — is every
# constructor in the bean graph satisfiable — on a machine with no Docker daemon.
# The moment that check needs a container it gets tagged `integration`, drops out
# of the default build, and stops being run on the commit that would have needed
# it. That is how app-api shipped unable to boot with 371 green tests.
#
# What is deliberately NOT asserted here: that any query runs. The adapters issue
# PostgreSQL-specific SQL — partition-pruning windows, ON CONFLICT, FOR UPDATE
# SKIP LOCKED — and H2 either rejects those or, worse, accepts them with different
# semantics. They are verified against a real 18.6 container in
# platform-persistence, under -Pintegration. Splitting the two is the point: one
# test that needs nothing catches missing beans, and one that needs Docker catches
# wrong SQL.
# =============================================================================

spring:
  datasource:
    # MODE=PostgreSQL for the identifier and type-name aliases; the schema has to
    # be created by INIT because the entities are all qualified `notif.*` and
    # Hibernate will not create a schema it was only told to write into.
    url: jdbc:h2:mem:notification-api;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS notif
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    # create-drop, not validate: validate would compare 13 entity mappings against
    # a schema H2 has not been given. The real mapping check is
    # EntityMappingIntegrationTest, which validates against the migrated schema on
    # PostgreSQL -- the only place that check means anything.
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    # The baseline is PostgreSQL DDL: partitioned parents, partial indexes,
    # plpgsql functions. None of it applies to H2, and none of it is what this
    # test is about.
    enabled: false

  kafka:
    # A port nothing listens on, so a stray produce fails fast instead of finding
    # a broker somebody happened to leave running and making the test's result
    # depend on the developer's machine.
    bootstrap-servers: localhost:1
    listener:
      auto-startup: false

  data:
    redis:
      # Lettuce connects lazily, so no Valkey is contacted while the context
      # builds. A test that exercised the quota guard would need one; this one
      # does not.
      host: localhost
      port: 1
      timeout: 100ms
      connect-timeout: 100ms

notification:
  api:
    security:
      # false, matching production. permit-all is a local convenience and a test
      # that turned it on would be asserting the wrong chain.
      permit-all: false
  providers:
    mock:
      enabled: true
    mock-chaos:
      enabled: false

logging:
  level:
    org.hibernate.tool.schema: error
    org.apache.kafka: error
    io.lettuce: error
